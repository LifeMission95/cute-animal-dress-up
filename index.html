    <meta
      name="description"
      content="토끼 모찌, 치타 치치, 펭귄 포포에게 귀여운 코디 세트를 입혀 주는 어린이용 옷입히기 게임"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <div class="sky-shape sky-shape--one" aria-hidden="true"></div>
    <div class="sky-shape sky-shape--two" aria-hidden="true"></div>

    <main class="game-shell">

        <div class="header-title">
          <button class="header-back-button is-hidden" id="changeCharacterButton" type="button" aria-label="캐릭터 선택 화면으로 돌아가기">
            <span aria-hidden="true">←</span>
          </button>
          <h1>작은 옷장</h1>
        </div>
        <div class="header-actions">
          <button class="refresh-button" id="refreshButton" type="button" aria-label="웹 새로고침">
            <span aria-hidden="true">↻</span>
          </button>
          <button class="sound-button" id="soundButton" type="button" aria-pressed="true">
            <span aria-hidden="true">♪</span>
            <span class="sound-label visually-hidden">소리 켜짐</span>
          </button>
        </div>
      </header>

        <div class="picker-copy">

        </div>
        <div class="picker-grid" id="pickerGrid"></div>
